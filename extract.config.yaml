# extract.config.yaml — repo-extract standalone package export
# RFC-0070: @warpgogol/repo-extract (dogfooding — export itself)
# RFC-0071: Explicit org-specific values (no hardcoded defaults)

projectDir: packages/repo-extract
destName: repo-extract
standalone: true

workspacePrefixes:
  - "@syrokomskyi/"
  - "@warpgogol/"
stripScopes:
  - "@syrokomskyi/"
  - "@warpgogol/"
  - "@wgogol/"
preservePackages:
  - "@warpgogol/repo-extract"
packageManager: "pnpm"
ignoreDirs:
  - .output
  - .debug
  - .debug-public
  - .astro
  - spec
  - .agents

extraGitignore:
  - .output
  - .debug
  - .debug-public

postProcess:
  - action: delete
    path: AGENTS.md

git:
  remote: git@github.com:syrokomskyi/repo-extract.git
  autoPush: true
  # RFC-0131: the standalone remote accumulates reconcile commits, so each
  # export's rewritten history diverges — reconcile automatically.
  autoReconcile: true

skipSecretScan: true
